<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">KAMLESH &amp; SONS Nepalgunj five-shutter working plan</title>
  <desc id="desc">A sixty-foot-long by twelve-foot-wide strip with one twelve-foot end facing the highway and four twelve-foot shutters facing the covered gallery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#292d32"/>
    </marker>
    <pattern id="gallery" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e8eaed"/>
      <path d="M0 20L20 0M-5 5L5-5M15 25L25 15" stroke="#c8ccd1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="650" fill="#f5f6f7"/>
  <text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111315">KAMLESH &amp; SONS — FIVE-SHUTTER WORKING PLAN</text>
  <text x="80" y="96" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5057">Approx. 60'-0&quot; long × 12'-0&quot; wide • five connected 12' × 12' bays • 720 sq ft working assumption</text>
  <text x="80" y="124" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#c34534">CONCEPT ONLY — NOT FOR CONSTRUCTION; VERIFY ALL SITE DIMENSIONS AND STRUCTURE</text>

  <!-- Highway at the 12 ft short end only -->
  <rect x="45" y="170" width="95" height="240" rx="4" fill="#43484f"/>
  <path d="M92 185V395" stroke="#f5f6f7" stroke-width="3" stroke-dasharray="18 14"/>
  <text x="92" y="295" transform="rotate(-90 92 295)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">HIGHWAY</text>

  <!-- Covered gallery begins beside Bay 2 and continues past Bay 5 -->
  <rect x="410" y="430" width="960" height="105" fill="url(#gallery)" stroke="#a7adb5" stroke-width="2"/>
  <text x="890" y="493" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#292d32">COVERED GALLERY — FOUR SHUTTERS / GLASS FRONTS</text>

  <!-- Store footprint: scale 20 px per foot -->
  <rect x="170" y="170" width="1200" height="240" fill="#ffffff" stroke="#111315" stroke-width="7"/>

  <!-- Bay fills -->
  <rect x="174" y="174" width="232" height="232" fill="#ece5da"/>
  <rect x="414" y="174" width="232" height="232" fill="#f0e2c8"/>
  <rect x="654" y="174" width="232" height="232" fill="#dfe5eb"/>
  <rect x="894" y="174" width="232" height="232" fill="#e8dfd2"/>
  <rect x="1134" y="174" width="232" height="232" fill="#dce2e4"/>

  <!-- Bay divisions -->
  <g stroke="#292d32" stroke-width="3" stroke-dasharray="9 7">
    <line x1="410" y1="170" x2="410" y2="410"/>
    <line x1="650" y1="170" x2="650" y2="410"/>
    <line x1="890" y1="170" x2="890" y2="410"/>
    <line x1="1130" y1="170" x2="1130" y2="410"/>
  </g>

  <!-- Solid first-bay gallery-side wall -->
  <line x1="170" y1="410" x2="410" y2="410" stroke="#111315" stroke-width="12"/>
  <text x="290" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e646b">SOLID SIDE / NO HIGHWAY FRONT</text>

  <!-- Four gallery-facing glazed shutter lines -->
  <g stroke="#2f63d8" stroke-width="10">
    <line x1="416" y1="410" x2="644" y2="410"/>
    <line x1="656" y1="410" x2="884" y2="410"/>
    <line x1="896" y1="410" x2="1124" y2="410"/>
    <line x1="1136" y1="410" x2="1364" y2="410"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2f63d8" text-anchor="middle">
    <text x="530" y="426">GLASS 1</text>
    <text x="770" y="426">GLASS 2</text>
    <text x="1010" y="426">GLASS 3</text>
    <text x="1250" y="426">GLASS 4</text>
  </g>

  <!-- Highway-facing entrance at the 12 ft end -->
  <line x1="170" y1="222" x2="170" y2="356" stroke="#2f63d8" stroke-width="12"/>
  <path d="M125 289H188" stroke="#2f63d8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="145" y="375" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f63d8">12 FT HIGHWAY-FACING ENTRANCE</text>

  <!-- Back-wall merchandising band -->
  <g fill="#292d32" opacity="0.92">
    <rect x="190" y="188" width="195" height="34" rx="4"/>
    <rect x="430" y="188" width="195" height="34" rx="4"/>
    <rect x="670" y="188" width="195" height="34" rx="4"/>
    <rect x="910" y="188" width="195" height="34" rx="4"/>
    <rect x="1150" y="188" width="195" height="34" rx="4"/>
  </g>

  <!-- Slim fixtures and service elements -->
  <rect x="255" y="252" width="100" height="48" rx="5" fill="#c9aa77" stroke="#5b4b34" stroke-width="2"/>
  <rect x="455" y="260" width="150" height="38" rx="4" fill="#c9aa77" stroke="#5b4b34" stroke-width="2"/>
  <rect x="695" y="260" width="150" height="38" rx="4" fill="#c9aa77" stroke="#5b4b34" stroke-width="2"/>
  <rect x="935" y="260" width="150" height="38" rx="4" fill="#c9aa77" stroke="#5b4b34" stroke-width="2"/>
  <rect x="1155" y="252" width="92" height="48" rx="4" fill="#66717a"/>
  <rect x="1258" y="178" width="104" height="86" rx="3" fill="#292d32"/>
  <text x="1310" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SECURE</text>
  <text x="1310" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">STOCK</text>

  <!-- Clear circulation lane -->
  <rect x="410" y="322" width="950" height="70" rx="5" fill="#ffffff" opacity="0.74" stroke="#a7adb5" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M435 357H1330" stroke="#2f63d8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="885" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f63d8">CLEAR LINEAR CUSTOMER FLOW</text>

  <!-- Zone titles -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#111315">
    <text x="290" y="328" font-size="17" font-weight="700">BAY 1</text>
    <text x="290" y="349" font-size="14">K&amp;S ARRIVAL</text>
    <text x="290" y="368" font-size="14">PREMIUM CONSULT</text>

    <text x="530" y="244" font-size="17" font-weight="700">BAY 2</text>
    <text x="530" y="317" font-size="14">SAMSUNG / ANDROID</text>

    <text x="770" y="244" font-size="17" font-weight="700">BAY 3</text>
    <text x="770" y="317" font-size="14">MIXED ANDROID / LAPTOPS</text>

    <text x="1010" y="244" font-size="17" font-weight="700">BAY 4</text>
    <text x="1010" y="317" font-size="14">PREMIUM ACCESSORIES</text>

    <text x="1250" y="288" font-size="17" font-weight="700">BAY 5</text>
    <text x="1250" y="309" font-size="14">K&amp;S CARE / BILLING</text>
  </g>

  <!-- Dimensions -->
  <line x1="170" y1="148" x2="1370" y2="148" stroke="#292d32" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="770" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#292d32">60'-0&quot; APPROX.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5e646b" text-anchor="middle">
    <text x="290" y="165">12'</text>
    <text x="530" y="165">12'</text>
    <text x="770" y="165">12'</text>
    <text x="1010" y="165">12'</text>
    <text x="1250" y="165">12'</text>
  </g>
  <line x1="1405" y1="170" x2="1405" y2="410" stroke="#292d32" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1433" y="295" transform="rotate(90 1433 295)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#292d32">12'-0&quot; APPROX.</text>

  <!-- Legend -->
  <rect x="80" y="575" width="20" height="8" fill="#2f63d8"/>
  <text x="112" y="585" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#292d32">Customer-facing glass / entrance</text>
  <line x1="405" y1="580" x2="445" y2="580" stroke="#292d32" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="458" y="585" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#292d32">Working 12 ft bay division</text>
  <text x="1390" y="585" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e646b">Final zoning may shift after the measured survey.</text>
</svg>
