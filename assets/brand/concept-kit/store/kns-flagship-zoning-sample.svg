  <text x="101" y="152" fill="#6B737D" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="2">NOT TO SCALE · VALIDATE AGAINST ACTUAL SITE, SAFETY, ACCESSIBILITY, AND DRAWINGS</text>
