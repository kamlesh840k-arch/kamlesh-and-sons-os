  <text x="455" y="363" fill="#C8CDD3" font-family="Arial, Helvetica, sans-serif" font-size="20">Open tables · category walls</text>
  <rect x="900" y="250" width="570" height="310" rx="14" fill="#2F63D8" opacity=".88"/>
